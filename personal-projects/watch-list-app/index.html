<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>Loofa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">

        <aside class="sidebar">
            <h2>|||</h2>

            <nav>
                <a href="#" class="active">Home</a>
                <a href="#">Watch Lists</a>
                <a href="#">Rankings</a>
            </nav>
        </aside>

        <main class="main-content">
            <h1>Welcome to Loofa</h1>

            <section class="countdown">
                <p class="eyebrow">YOUR MARVEL MARATHON</p>
                <h2>Avengers Doomsday</h2>

            <div class="countdown-display">
                <div class="countdown-unit">
                    <span id="days">00</span>
                    <span class="countdown-label">DAYS</span>
                </div>

                <div class="countdown-unit">
                    <span id="hours">00</span>
                    <span class="countdown-label">HOURS</span>
                </div>

                <div class="countdown-unit">
                    <span id="minutes">00</span>
                    <span class="countdown-label">MINUTES</span>
                </div>

                <div class="countdown-unit">
                    <span id="seconds">00</span>
                    <span class="countdown-label">SECONDS</span>
                </div>
            </div>
            </section>

            <section class="currently-watching">
                <p class="eyebrow">PICK UP WHERE YOU LEFT OFF</p>
                <h2>Continue Watching</h2>

                <div class="show-card">
                    <div class="show-artwork">
                        <span>YOUR SHOW ARTWORK</span>
                    </div>

                    <div class="show-info">
                        <h3>Loki</h3>
                        <p class="episode-info">Season 1 Episode 3</p>
                        <p class="episode-title">Lamentis</p>
                        <p class="show-description">
                            The Show's Description will appear here once the API is connected
                        </p>
                    </div>
                </div>
            </section>


            
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
